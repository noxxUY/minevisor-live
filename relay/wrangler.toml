name = "minevisor-relay"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Also at <name>.<subdomain>.workers.dev.
workers_dev = true
preview_urls = false

# relay.minevisor.cc: needs the minevisor.cc zone in the same Cloudflare
# account as the Worker. Uncomment once it is.
# routes = [{ pattern = "relay.minevisor.cc", custom_domain = true }]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
